services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/data/pocketbase/caddy_data:/data
      - /var/data/pocketbase/caddy_config:/config
    networks:
      - pocketbase-net

networks:
  pocketbase-net:
    name: pocketbase-net
    external: true
